plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.ac.seoil.motionaffect'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.ac.seoil.motionaffect'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '0.1'
        // 노트9(arm64)만 대상: MediaPipe 네이티브 라이브러리 크기 줄이기
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // 측정 전용 앱(스토어 배포 안 함): Android 10 단말에 맞춰 targetSdk 29 유지
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'task'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // S5 시청 실험: 앞카메라 표정 계수(단말 내 처리, 영상 저장 안 함)
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
    // T11 LiteRT 온디바이스 학습 프로브(설계 R10): 표준 런타임만. 통과하지 못하면 순수 Java SGD로 전환
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // 로컬 단위 테스트(설계 R12): gradle testReleaseUnitTest
    testImplementation 'junit:junit:4.13.2'
}
