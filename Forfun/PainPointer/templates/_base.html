<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>{% block title %}PainPointer{% endblock %}</title>
<style>
body{margin:0;padding:24px 16px;font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:#1a1a1a;max-width:820px;margin-inline:auto}
h1{font-size:22px}label{display:block;font-weight:600;margin-top:14px}
input[type=text],textarea{width:100%;padding:8px;font:inherit;border:1px solid #bbb;border-radius:4px}
textarea{min-height:140px}
button{font:inherit;padding:8px 16px;border:1px solid #1a1a1a;background:#fff;border-radius:4px;cursor:pointer}
button.primary{background:#1a1a1a;color:#fff}
.mut{color:#666;font-size:13px}.banner{border-left:5px solid #f0a030;background:#fff4e5;padding:10px 14px;margin:12px 0;border-radius:4px}
.bad{border-color:#d9534f;background:#fdeaea}
table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}
code{background:#f6f6f4;padding:0 4px;border-radius:3px}pre{background:#f6f6f4;padding:10px;border-radius:4px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="mut"><a href="/">PainPointer</a> — 페인포인트 근거 리포트 생성기 (로컬)</div>
{% block body %}{% endblock %}
</body></html>
