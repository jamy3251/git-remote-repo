[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painpointer"
version = "0.1.0"
description = "페인포인트 근거 리포트 생성기 — 한국어 커뮤니티·앱리뷰 코퍼스 기반, 분모 있는 수치 + 원문 인용"
requires-python = ">=3.11"
dependencies = [
  "dccrawler",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "anthropic>=0.80",
  "kiwipiepy>=0.18",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
  "httpx>=0.27",
  "google-play-scraper>=1.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["painpointer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 API/네트워크가 필요한 테스트(기본 제외)"]
addopts = "-m 'not live'"
