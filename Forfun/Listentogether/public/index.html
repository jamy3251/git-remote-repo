<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listen Together — 같이 듣기</title>
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Lobby -->
  <main id="lobby" class="screen">
    <div class="brand">
      <h1>Listen&nbsp;Together</h1>
      <p class="tagline">게임하며 둘이, 끊김 없이, 같은 노래를 같은 순간에.</p>
    </div>
    <form id="join-form" class="card" autocomplete="off">
      <label class="field">
        <span>이름</span>
        <input id="name-input" type="text" maxlength="24" placeholder="너의 닉네임" />
      </label>
      <label class="field">
        <span>방 코드</span>
        <input id="room-input" type="text" maxlength="8" placeholder="예: FIFA42" />
      </label>
      <div class="actions">
        <button type="button" id="create-btn" class="btn ghost">새 방 만들기</button>
        <button type="submit" id="join-btn" class="btn primary">참여</button>
      </div>
      <p id="lobby-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- Room -->
  <main id="room" class="screen hidden">
    <header class="room-head">
      <div>
        <span class="muted">방 코드</span>
        <strong id="room-code-label">----</strong>
        <button id="copy-link" class="btn tiny">링크 복사</button>
      </div>
      <div id="role-badge" class="badge">…</div>
    </header>

    <div class="room-grid">
      <section class="col-main">
        <div class="player-wrap">
          <div id="player"></div>
          <button id="start-gate" class="start-gate hidden">▶ 탭하여 같이 듣기</button>
        </div>

        <!-- Now-playing widget (Kakao/Naver music widget feel) -->
        <div id="now-playing" class="np-widget empty">
          <img id="np-thumb" class="np-thumb" alt="" />
          <div class="np-text">
            <div id="np-title" class="np-title">대기열이 비어 있어요</div>
            <div id="np-sub" class="np-sub">아래에 유튜브 링크를 추가하세요</div>
            <div class="np-progress"><span id="np-progress-fill"></span></div>
          </div>
          <span id="np-eq" class="np-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <div class="transport">
          <button id="prev-btn" class="btn" title="이전 곡">⏮</button>
          <button id="playpause-btn" class="btn" title="재생/정지">⏯</button>
          <button id="next-btn" class="btn" title="다음 곡">⏭</button>
          <span id="now-time" class="muted mono">0:00</span>
          <span id="quality-badge" class="qbadge" title="현재 실제 재생 화질 (유튜브가 자동 결정, 최고화질 요청 중)"></span>
        </div>

        <form id="add-form" class="field-row">
          <input id="add-input" type="text" placeholder="유튜브 영상/재생목록 URL → 대기열 추가" />
          <button type="submit" class="btn primary">추가</button>
        </form>
        <p id="sync-status" class="muted mono"></p>

        <div class="card">
          <h2 class="h2">대기열 <span id="queue-count" class="muted"></span></h2>
          <ul id="queue" class="queue"></ul>
        </div>

        <div class="card">
          <div class="row-between">
            <h2 class="h2">함께 듣는 중</h2>
            <button id="take-control" class="btn tiny hidden">동기화 기준 가져오기</button>
          </div>
          <ul id="members" class="members"></ul>
        </div>
      </section>

      <aside class="col-side">
        <!-- DJ mixer deck (moved to the side) -->
        <div class="deck">
          <div id="deck-bg" class="deck-bg" aria-hidden="true"></div>
          <button id="vinyl" class="vinyl" title="LP를 돌리면 스크래치 → 다음 곡">
            <span class="vinyl-shine"></span>
            <span id="vinyl-label" class="vinyl-label">LT</span>
            <span class="tonearm" aria-hidden="true"></span>
          </button>
          <div class="deck-right">
            <div id="eq" class="deck-eq" aria-hidden="true"></div>
            <div class="deck-knobs">
              <label class="knob"><span>LOW</span><input type="range" min="0" max="100" value="55" data-eq="low" /></label>
              <label class="knob"><span>MID</span><input type="range" min="0" max="100" value="55" data-eq="mid" /></label>
              <label class="knob"><span>HIGH</span><input type="range" min="0" max="100" value="55" data-eq="high" /></label>
              <label class="knob"><span>GAIN</span><input type="range" min="0" max="100" value="70" data-eq="gain" /></label>
            </div>
            <div id="hotcues" class="hotcues" title="핫큐 패드 — 누르면 소리 + 빛"></div>
            <label class="xfader"><span>XFADE</span><input type="range" min="0" max="100" value="50" id="xfader" /></label>
          </div>
        </div>

        <div class="card side-card">
          <h2 class="h2">추천곡</h2>
          <p id="reco-note" class="muted mini"></p>
          <ul id="reco" class="reco"></ul>
        </div>
      </aside>

      <!-- Visualizer (opposite side from the mixer) -->
      <aside class="col-vis">
        <div class="card vis-card">
          <div class="row-between">
            <h2 class="h2">비주얼라이저</h2>
            <button id="mic-btn" class="btn tiny" title="마이크로 실제 소리에 반응시켜요 (방 소리가 마이크로 들어갑니다)">🎤 음악 반응</button>
          </div>
          <canvas id="vis-canvas"></canvas>
          <p class="muted mini" style="margin-top:8px">기본은 애니메이션이에요. "음악 반응"을 켜면 마이크로 실제 소리에 맞춰 움직여요.</p>
        </div>
      </aside>
    </div>

    <button id="leave-btn" class="btn ghost wide">나가기</button>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
