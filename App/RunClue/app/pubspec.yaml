name: runclue
description: RunClue - 참여형 미션 플랫폼
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # BaaS
  supabase_flutter: ^2.3.0
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Routing
  go_router: ^13.0.0
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  # Maps
  google_maps_flutter: ^2.5.0
  # Camera & Media
  image_picker: ^1.0.7
  camera: ^0.11.0
  # QR
  mobile_scanner: ^4.0.0
  qr_flutter: ^4.1.0
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  # Fonts
  google_fonts: ^6.1.0
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  permission_handler: ^11.2.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.2
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  riverpod_generator: ^2.3.9
  # mockito: ^5.4.4  # temporarily disabled for build_runner compat

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
