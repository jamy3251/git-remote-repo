<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #1a1a2e;
      color: #eee;
      font-family: monospace;
      padding: 12px;
    }
    h1 {
      color: #e2b714;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
    }
    .status {
      font-size: 11px;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid #333;
      background: #16213e;
    }
    .status.connected { border-color: #4ade80; }
    .status.disconnected { border-color: #e94560; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
    }
    .dot.green { background: #4ade80; }
    .dot.red { background: #e94560; }
    .dot.yellow { background: #e2b714; }
    label {
      display: block;
      font-size: 11px;
      color: #a0a0b0;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      background: #0f3460;
      border: 2px solid #e2b714;
      color: #eee;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: #fff; }
    button {
      width: 100%;
      padding: 6px;
      background: #0f3460;
      border: 2px solid #e2b714;
      color: #e2b714;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #e2b714; color: #1a1a2e; }
    .tabs {
      margin-top: 10px;
      border-top: 1px solid #333;
      padding-top: 8px;
    }
    .tab-item {
      font-size: 10px;
      padding: 4px 6px;
      margin-bottom: 4px;
      background: #16213e;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-item .name { color: #e2b714; }
  </style>
</head>
<body>
  <h1>MyAgent Bridge</h1>

  <div id="connectionStatus" class="status disconnected">
    <span class="dot red" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <label>Server URL:</label>
  <input type="text" id="serverUrl" placeholder="http://localhost:3456">
  <button id="saveBtn">Save & Connect</button>

  <div class="tabs" id="tabsList">
    <label>Detected AI Tabs:</label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
