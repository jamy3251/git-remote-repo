plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mytrainer.mytrainer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications 가 desugaring 을 요구한다.
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mytrainer.mytrainer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24 // firebase-auth 23+, MediaPipe tasks-vision 24+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // MediaPipe 가 모델을 그대로 읽도록 압축하지 않는다.
    androidResources {
        noCompress "tflite"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 네이티브 지오펜스(GeofencingClient). Flutter 공식 플러그인이 없어 직접 붙인다.
    implementation "com.google.android.gms:play-services-location:21.3.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // 기구 사진 임베딩(설계 T7). 전처리(크기·정규화)를 MediaPipe 가 모델에 맞춰 한다.
    implementation "com.google.mediapipe:tasks-vision:0.10.14"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
}
